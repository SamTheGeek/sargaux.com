name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

# Pure-logic specs (tests/unit-specs.ts): no build, no browser, no Notion
# secrets. Runs in seconds, so a logic regression fails fast and cheaply
# without waiting on the e2e job's build and browser install.
jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip tests for draft PRs
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # `predicate-quantifier: every` is load-bearing. The default, 'some', ORs
      # the patterns together, so a bare '**' would match every changed file and
      # the docs-only skip could never fire. With 'every' a file counts only if
      # it matches all the negations, i.e. it really is a non-docs file.
      - name: Filter docs/config changes
        id: paths
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: |
            non_docs:
              - '!**/*.md'
              - '!**/*.yml'
              - '!**/*.yaml'
              - '!LICENSE'
              - '!.gitignore'
              - '!playwright.config.ts'

      - name: Determine docs-only changes
        id: filter
        run: |
          if [[ "${{ steps.paths.outputs.non_docs }}" != "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.docs_only != 'true'
        run: npm ci

      - name: Run unit tests
        if: steps.filter.outputs.docs_only != 'true'
        run: npm run test:unit

      - name: Docs-only change detected; tests skipped
        if: steps.filter.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; tests skipped"
