name: Sync NYC Photo Originals

# Keeps the NYC gallery originals in S3 in step with the iCloud albums
# (scripts/sync-nyc-photos.ts, docs/photo-originals-aws.md): uploads new and
# edited photos' originals, and deletes the originals of photos with a 👎 or
# removed from an album. It never commits: the gallery manifests themselves
# are rebuilt by every Netlify build (netlify.toml), so photo changes go live
# with any deploy.
#
# Triggers:
#   - every push to main, i.e. every production deploy, so the bucket matches
#     what that deploy's build just read from iCloud;
#   - daily, and manually from the Actions tab. If the albums changed since
#     the last deploy and the NETLIFY_BUILD_HOOK_URL secret is set, these runs
#     also start a Netlify build, so new photos don't wait for the next merge.
#
# AWS access is OIDC: the run assumes the stack's SyncRole, whose trust policy
# only accepts workflow runs on main of this repo, for at most an hour. No AWS
# key is stored anywhere. The role can only list/read/write/delete under the
# bucket's nyc/ prefix (the last-deployed manifest hash is kept at
# nyc/_state/manifests.sha256, outside every gallery's prefix).
#
# This repo is public, so these logs are too. The sync prints only gallery
# ids, counts and photo GUIDs: never an album token, an iCloud or CloudFront
# URL, or credentials. GitHub masks the secrets below; keep it that way and
# don't add steps that echo env vars or `set -x`.
#
# Setup (once), Settings → Secrets and variables → Actions:
#   Variables: NYC_PHOTOS_SYNC_ROLE_ARN (stack output SyncRoleArn),
#              NYC_PHOTOS_BUCKET (BucketName), NYC_PHOTOS_AWS_REGION (BucketRegion)
#   Secrets:   NYC_ALBUM_TOKEN_CELEBRATION, NYC_ALBUM_TOKEN_PREPARATION,
#              NYC_ALBUM_TOKEN_AFTERPARTY (the albums' public-link tokens),
#              NETLIFY_BUILD_HOOK_URL (optional)
# Until the role variable exists the job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 11 * * *' # daily, 11:43 UTC

concurrency:
  group: nyc-photo-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Mirror originals to S3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The role only trusts main; skip cleanly elsewhere or before setup.
    if: github.ref == 'refs/heads/main' && vars.NYC_PHOTOS_SYNC_ROLE_ARN != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Assume the sync role (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.NYC_PHOTOS_SYNC_ROLE_ARN }}
          aws-region: ${{ vars.NYC_PHOTOS_AWS_REGION }}
          role-session-name: nyc-photo-sync-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Sync originals
        env:
          NYC_PHOTOS_BUCKET: ${{ vars.NYC_PHOTOS_BUCKET }}
          NYC_ALBUM_TOKEN_CELEBRATION: ${{ secrets.NYC_ALBUM_TOKEN_CELEBRATION }}
          NYC_ALBUM_TOKEN_PREPARATION: ${{ secrets.NYC_ALBUM_TOKEN_PREPARATION }}
          NYC_ALBUM_TOKEN_AFTERPARTY: ${{ secrets.NYC_ALBUM_TOKEN_AFTERPARTY }}
        run: node scripts/sync-nyc-photos.ts

      - name: Rebuild the site if the albums changed since the last deploy
        env:
          BUCKET: ${{ vars.NYC_PHOTOS_BUCKET }}
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          state="s3://$BUCKET/nyc/_state/manifests.sha256"
          current=$(cat src/content/nycPhotos/celebration.json src/content/nycPhotos/preparation.json src/content/nycPhotos/afterparty.json | sha256sum | cut -d' ' -f1)
          if [ "$EVENT" = "push" ]; then
            # This push is itself being deployed, with the same albums.
            echo "$current" | aws s3 cp - "$state" --only-show-errors
            echo "Recorded the manifests this deploy is building."
            exit 0
          fi
          previous=$(aws s3 cp "$state" - 2>/dev/null || true)
          if [ "$current" = "$previous" ]; then
            echo "No album changes since the last deploy."
            exit 0
          fi
          if [ -z "$HOOK" ]; then
            echo "Albums changed since the last deploy; they go live with the next one (NETLIFY_BUILD_HOOK_URL not set)."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK" > /dev/null
          echo "$current" | aws s3 cp - "$state" --only-show-errors
          echo "Albums changed: started a Netlify build."
