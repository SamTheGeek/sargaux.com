name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync wiki/ to the GitHub wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Push wiki content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_DIR="$(mktemp -d)"

          if ! git clone --depth 1 "$WIKI_URL" "$WIKI_DIR" 2>/dev/null; then
            echo "Wiki repo not initialized yet — creating it."
            git init "$WIKI_DIR"
            git -C "$WIKI_DIR" remote add origin "$WIKI_URL"
          fi

          rsync -a --delete --exclude='.git' wiki/ "$WIKI_DIR"/

          cd "$WIKI_DIR"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Sync wiki from ${GITHUB_SHA}"
          git branch -M master
          git push -u origin master
