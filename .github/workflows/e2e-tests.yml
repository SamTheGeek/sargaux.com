name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

# Accessibility, best-practices, security/auth/access-control and the page,
# RSVP, calendar and i18n specs share ONE job so the site is built and Chromium
# installed once (they used to be separate workflows, each paying for both).
# Pure unit specs run in unit-tests.yml instead (SKIP_UNIT_SPECS below), and
# performance-tests.yml stays separate because it needs --workers=1.
#
# The suite mutates the shared 🤖 Notion party (create/update/archive RSVP
# Responses). Parallel runs across stacked PRs race those rows and flake as
# "Can't edit block that is archived" or GET-after-POST misses. Queue rather
# than cancel so every PR still gets a full run.
concurrency:
  group: notion-security-tests
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E, Accessibility & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip tests for draft PRs
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # `predicate-quantifier: every` is load-bearing. The default, 'some', ORs
      # the patterns together, so a bare '**' would match every changed file and
      # the docs-only skip could never fire. With 'every' a file counts only if
      # it matches all the negations, i.e. it really is a non-docs file.
      - name: Filter docs/config changes
        id: paths
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: |
            non_docs:
              - '!**/*.md'
              - '!**/*.yml'
              - '!**/*.yaml'
              - '!LICENSE'
              - '!.gitignore'
              - '!playwright.config.ts'

      - name: Determine docs-only changes
        id: filter
        run: |
          if [[ "${{ steps.paths.outputs.non_docs }}" != "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.docs_only != 'true'
        run: npm ci

      - name: Get Playwright version
        if: steps.filter.outputs.docs_only != 'true'
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.filter.outputs.docs_only != 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # CI runs are always headless, so the chromium headless shell is enough
      # (roughly half the download of full chromium). Local test:install keeps
      # the full browser for headed debugging.
      - name: Install Playwright browsers
        if: steps.filter.outputs.docs_only != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.filter.outputs.docs_only != 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # No separate build step — the Playwright webServer command runs
      # `npm run build` itself, so a standalone build would run twice.
      # --project=chromium leaves out the `mutating` project: it renames a real
      # Guest List row and has never run in CI; run it deliberately instead.
      # performance.spec.ts is left to performance-tests.yml (needs --workers=1).
      - name: Run e2e tests
        if: steps.filter.outputs.docs_only != 'true'
        run: npx playwright test --project=chromium --grep-invert "Performance Tests"
        env:
          SKIP_UNIT_SPECS: '1'
          FEATURE_GLOBAL_WEDDING_SITE_ENABLED: 'true'
          FEATURE_GLOBAL_NOTION_BACKEND: 'true'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_GUEST_LIST_DB: ${{ secrets.NOTION_GUEST_LIST_DB }}
          NOTION_EVENT_CATALOG_DB: ${{ secrets.NOTION_EVENT_CATALOG_DB }}
          NOTION_RSVP_RESPONSES_DB: ${{ secrets.NOTION_RSVP_RESPONSES_DB }}
          CALENDAR_HMAC_SECRET: ${{ secrets.CALENDAR_HMAC_SECRET }}
          SESSION_HMAC_SECRET: ${{ secrets.SESSION_HMAC_SECRET }}
          RESEND_ADMIN_SECRET: ${{ secrets.RESEND_ADMIN_SECRET }}

      - name: Upload test results
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test traces
        if: steps.filter.outputs.docs_only != 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-traces
          path: test-results/
          retention-days: 30

      - name: Docs-only change detected; tests skipped
        if: steps.filter.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; tests skipped"
